<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин доната</title>
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Сетка для карточек */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Сама карточка */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Картинка (заглушка) */
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #ddd; /* Цвет, если картинки нет */
        }

        /* Название ранга */
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* Цена */
        .price {
            font-weight: bold;
            color: #666;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* Кнопка купить */
        .buy-btn {
            background-color: #f39c12; /* Оранжевый цвет */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .buy-btn:hover {
            background-color: #e67e22;
        }
        
        /* Бейдж "Скидка" или "ХИТ" */
        .badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
